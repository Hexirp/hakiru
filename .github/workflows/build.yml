name: build

on:
  push:

env:
  GHCUP_CACHE_VERSION: v-1-1-1
  STACK_PANTRY_CACHE_VERSION: v-1-1-1
  STACK_SNAPSHOT_CACHE_VERSION: v-1-1-1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # アーキテクチャの問題のため無効化する。詳細は /issue/issue-1-1-5.md と /issue/issue-1-2-16.md に書いてある。
          # - macos-latest
          - windows-latest
        haskell:
          - ghc: 9.8.4
            cabal: 3.16.1.0
            stack: 3.11.1
            resolver: lts-23.28
    name: Build os-${{ matrix.os }} ghc-${{ matrix.haskell.ghc }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7.0.1
      - name: GHCup Cache
        id: ghcup-cache
        uses: actions/cache@v6.1.0
        env:
          CACHE_VERSION: ${{ env.GHCUP_CACHE_VERSION }}
          GHCUP_ROOT_Linux: ~/.ghcup
          GHCUP_ROOT_Windows: C:/ghcup
        with:
          path: |
            ${{ env[format('GHCUP_ROOT_{0}', runner.os)] }}/bin/*
            ${{ env[format('GHCUP_ROOT_{0}', runner.os)] }}/cache/*
            ${{ env[format('GHCUP_ROOT_{0}', runner.os)] }}/config.yaml
            ${{ env[format('GHCUP_ROOT_{0}', runner.os)] }}/ghc/${{ matrix.haskell.ghc }}
          key: cache--ghcup--${{ env.CACHE_VERSION }}--${{ runner.os }}--${{ matrix.os }}--ghc-${{ matrix.haskell.ghc }}--cabal-${{ matrix.haskell.cabal }}--stack-${{ matrix.haskell.stack }}
      - name: Setup
        id: setup
        uses: haskell-actions/setup@v2.12.1
        with:
          ghc-version: ${{ matrix.haskell.ghc }}
          cabal-version: ${{ matrix.haskell.cabal }}
          stack-version: ${{ matrix.haskell.stack }}
          enable-stack: true
      - name: Stack Pantry Cache
        id: stack-pantry-cache
        uses: actions/cache@v6.1.0
        env:
          CACHE_VERSION: ${{ env.STACK_PANTRY_CACHE_VERSION }}
        with:
          path: ${{ steps.setup.outputs.stack-root }}/pantry
          key: cache--stack-pantry--${{ env.CACHE_VERSION }}--${{ runner.os }}--${{ matrix.os }}--ghc-${{ matrix.haskell.ghc }}--resolver-${{ matrix.haskell.resolver }}--${{ hashFiles(format('stack-{0}.yaml.lock', matrix.haskell.resolver)) }}
          restore-keys: |
            cache--stack-pantry--${{ env.CACHE_VERSION }}--${{ runner.os }}--${{ matrix.os }}--ghc-${{ matrix.haskell.ghc }}--resolver-${{ matrix.haskell.resolver }}--
            cache--stack-pantry--${{ env.CACHE_VERSION }}--${{ runner.os }}--${{ matrix.os }}--ghc-${{ matrix.haskell.ghc }}--
      - name: Stack Snapshot Cache
        id: stack-snapshot-cache
        uses: actions/cache@v6.1.0
        env:
          CACHE_VERSION: ${{ env.STACK_SNAPSHOT_CACHE_VERSION }}
        with:
          path: |
            ${{ steps.setup.outputs.stack-root }}/stack.sqlite3
            ${{ steps.setup.outputs.stack-root }}/snapshots
          key: cache--stack-snapshot--${{ env.CACHE_VERSION }}--${{ runner.os }}--${{ matrix.os }}--ghc-${{ matrix.haskell.ghc }}--resolver-${{ matrix.haskell.resolver }}--${{ hashFiles(format('stack-{0}.yaml.lock', matrix.haskell.resolver)) }}
          restore-keys: |
            cache--stack-snapshot--${{ env.CACHE_VERSION }}--${{ runner.os }}--${{ matrix.os }}--ghc-${{ matrix.haskell.ghc }}--resolver-${{ matrix.haskell.resolver }}--
            cache--stack-snapshot--${{ env.CACHE_VERSION }}--${{ runner.os }}--${{ matrix.os }}--ghc-${{ matrix.haskell.ghc }}--
      - name: Dependencies Build
        id: dependencies-build
        run: stack --system-ghc --no-install-ghc --stack-yaml stack-${{ matrix.haskell.resolver }}.yaml build --fast --test --no-run-tests --only-dependencies
      - name: Build
        id: build
        run: stack --system-ghc --no-install-ghc --stack-yaml stack-${{ matrix.haskell.resolver }}.yaml build --fast --test --no-run-tests
      - name: Test
        id: test
        run: stack --system-ghc --no-install-ghc --stack-yaml stack-${{ matrix.haskell.resolver }}.yaml build --fast --test
