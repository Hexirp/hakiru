name: build

on:
  push:

env:
  STACK_PANTRY_CACHE_VERSION: v-1-1-1
  STACK_SNAPSHOT_CACHE_VERSION: v-1-1-1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # アーキテクチャの問題のため無効化する。詳細は /issue/issue-1-1-5.md と /issue/issue-1-2-16.md に書いてある。
          # - macos-latest
          - windows-latest
        haskell:
          - ghc: 9.8.4
            cabal: 3.16.1.0
            stack: 3.11.1
            resolver: lts-23.28
    name: Build os-${{ matrix.os }} ghc-${{ matrix.haskell.ghc }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup
        id: setup
        uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          ghc-version: ${{ matrix.haskell.ghc }}
          cabal-version: ${{ matrix.haskell.cabal }}
          stack-version: ${{ matrix.haskell.stack }}
          enable-stack: true
      - name: Stack Pantry Cache
        id: stack-pantry-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          CACHE_VERSION: ${{ env.STACK_PANTRY_CACHE_VERSION }}
        with:
          path: ${{ steps.setup.outputs.stack-root }}/pantry
          key: cache--stack-pantry--${{ env.CACHE_VERSION }}--${{ runner.os }}--${{ matrix.os }}--${{ matrix.haskell.ghc }}
      - name: Package Index Update
        id: package-index-update
        if: steps.stack-pantry-cache.outputs.cache-hit != 'true'
        run: stack --system-ghc update
      - name: Stack Snapshot Cache
        id: stack-snapshot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          CACHE_VERSION: ${{ env.STACK_SNAPSHOT_CACHE_VERSION }}
        with:
          path: |
            ${{ steps.setup.outputs.stack-root }}/stack.sqlite3
            ${{ steps.setup.outputs.stack-root }}/snapshots
          key: cache--stack-snapshots--${{ env.CACHE_VERSION }}--${{ runner.os }}--${{ matrix.os }}--${{ matrix.haskell.ghc }}--${{ hashFiles('stack.yaml.lock') }}
      - name: Dependencies Build
        id: dependencies-build
        # Dependencies Snapshot ステップが正常に機能するかどうかを確かめたいため、そのためには無関係である重すぎるステップは無効化する。
        if: false
        run: stack --system-ghc build --fast --test --no-run-tests --only-dependencies
      - name: Build
        id: build
        # Dependencies Snapshot ステップが正常に機能するかどうかを確かめたいため、そのためには無関係である重すぎるステップは無効化する。
        if: false
        run: stack --system-ghc build --fast --test --no-run-tests
      - name: Test
        id: test
        # Dependencies Snapshot ステップが正常に機能するかどうかを確かめたいため、そのためには無関係である重すぎるステップは無効化する。
        if: false
        run: stack --system-ghc build --fast --test
