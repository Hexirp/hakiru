  - tests/data/biblio/cites-meijer-pandoc-3.1.8plus.golden
  - tests/data/biblio/cites-multiple-pandoc-2.0.0plus.golden
  - tests/data/biblio/cites-multiple-pandoc-3.0.0plus.golden
  - tests/data/biblio/cites-multiple-pandoc-3.1.8plus.golden
  - tests/data/biblio/cites-multiple.markdown
  - tests/data/biblio/default.html
  - tests/data/biblio/page.markdown
  - tests/data/biblio/refs.bib
  - tests/data/biblio/refs.yaml
  - tests/data/biblio/refs2.yaml
  - tests/data/embed.html
  - tests/data/example.md
  - tests/data/example.md.metadata
  - tests/data/images/favicon.ico
  - tests/data/just-meta.html
  - tests/data/just-meta.html.out
  - tests/data/partial-helper.html
  - tests/data/partial.html
  - tests/data/partial.html.out
  - tests/data/posts/2010-08-26-birthday.md
  - tests/data/posts/2018-09-26.md
  - tests/data/posts/2019/05/10/tomorrow.md
  - tests/data/russian.md
  - tests/data/strip.html
  - tests/data/strip.html.out
  - tests/data/template-empty.html
  - tests/data/template.html
  - tests/data/template.html.out
  - data/templates/atom-item.xml
  - data/templates/atom.xml
  - data/templates/rss-item.xml
  - data/templates/rss.xml
  - data/templates/feed.json
  - data/templates/feed-item.json

synopsis:            A static website compiler library in Haskell (forked from Hakyll)
category:            Web

description:         Please see the README on GitHub at <https://github.com/Hexirp/hakiru#readme>

dependencies:
  - aeson ^>= 2.2.3.0
  - base ^>= 4.19.2.0
  - binary ^>= 0.8.9.1
  - blaze-html ^>= 0.9.2.0
  - bytestring ^>= 0.12.1.0
  - containers ^>= 0.6.8
  - contravariant ^>= 1.5.5
  - data-default ^>= 0.7.1.3
  - deepseq ^>= 1.5.1.0
  - directory ^>= 1.3.8.5
  - file-embed ^>= 0.0.16.0
  - filepath ^>= 1.4.301.0
  - fsnotify ^>= 0.4.3.0
  - hashable ^>= 1.4.7.0
  - http-types ^>= 0.12.4
  - http-conduit ^>= 2.3.9.1
  - lrucache ^>= 1.2.0.1
  - mtl ^>= 2.3.1
  - network-uri ^>= 2.6.4.2
  - optparse-applicative ^>= 0.18.1.0
  - pandoc ^>= 3.6
  - pandoc-types ^>= 1.23.1
  - parsec ^>= 3.1.17.0
  - process ^>= 1.6.25.0
  - random ^>= 1.2.1.3
  - regex-tdfa ^>= 1.3.2.4
  - resourcet ^>= 1.3.0
  - scientific ^>= 0.3.8.0
  - tagsoup ^>= 0.14.8
  - template-haskell ^>= 2.21.0.0
  - text ^>= 2.1.1
  - time ^>= 1.12.2
  - time-locale-compat ^>= 0.1.1.5
  - vector ^>= 0.13.2.0
  - wai ^>= 3.2.4
  - wai-app-static ^>= 3.1.9
  - warp ^>= 3.4.8
  - yaml ^>= 0.11.11.2
  - xml-conduit ^>= 1.9.1.4

language: Haskell2010

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

cpp-options:
  - -DPREVIEW_SERVER
  - -DWATCH_SERVER
  - -DCHECK_EXTERNAL
  - -DUSE_PANDOC

library:
  source-dirs: lib
  generated-other-modules: Paths_hakyll

executables:
  hakyll-init:
    main:                Init.hs
    source-dirs:         src
    generated-other-modules: Paths_hakyll
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - hakyll
  hakyll-website:
    main:                site.hs
    source-dirs:         web
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - hakyll

tests:
  hakyll-test:
    main:                TestSuite.hs
    source-dirs:         tests
    # Note that tests are purposefully run without threaded because of their side-effects. Test failures became apparent with tasty-1.5.4
    # ghc-options:
    dependencies:
      - hakyll
      - QuickCheck ^>= 2.14.3
      - tasty ^>= 1.5.3
      - tasty-golden ^>= 2.3.5
      - tasty-hunit ^>= 0.10.2
      - tasty-quickcheck ^>= 0.11
